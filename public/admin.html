<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servis Saatleri Yönetici</title>
<style>
/* Düzen: solda ayar paneli, sağda canlı A4 önizleme; dar ekranda sekmeli. Renkler kort yeşili + kağıt beyazı. */
:root{
  --bg:#eef1ee; --panel:#ffffff; --ink:#15211b; --muted:#5d6b63; --line:#d5ddd8;
  --primary:#1d5c47; --primary-ink:#ffffff; --soft:#e3efe9; --warn:#b4531a; --warn-soft:#f6e4d8;
  --field:#f7f9f7; --stage:#cfd6d1;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --panel:#18211c; --ink:#e6ede8; --muted:#97a69d; --line:#2b3831;
    --primary:#4fa686; --primary-ink:#06130d; --soft:#1f3329; --warn:#e08a4c; --warn-soft:#3a2b20;
    --field:#121a16; --stage:#0c110e; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);display:flex;flex-direction:column;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo-btn{border:0;background:none;padding:0;cursor:pointer;width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none;display:grid;place-items:center}
.logo-btn img,.logo-btn svg{width:40px;height:40px;object-fit:contain;display:block}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,460px) 1fr}
.panel{overflow:auto;padding:16px;border-right:1px solid var(--line)}
.preview{overflow:auto;background:var(--stage);position:relative}
.pane{display:none}
body[data-tab="schedule"] #pane-schedule,body[data-tab="doc"] #pane-doc,body[data-tab="look"] #pane-look{display:block}
#tab-preview{display:none}
@media (max-width:979px){
  .shell{grid-template-columns:1fr}
  .panel{border-right:0}
  #tab-preview{display:block}
  body[data-tab="preview"] .panel{display:none}
  body:not([data-tab="preview"]) .preview{display:none}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.card h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
input[type=text],input[type=password],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);min-height:38px}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--field);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--warn)}
.btn.small{padding:5px 9px;min-height:30px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--field);padding:5px 9px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.chip:hover{border-color:var(--primary)}
.chip.off{text-decoration:line-through;color:var(--muted);background:transparent;border-style:dashed}
.chip.extra{background:var(--soft);border-color:var(--primary);color:var(--primary)}
.chip.extra::after{content:" ×"}
.meta{color:var(--muted);font-size:12px;margin-top:8px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.toggle{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;color:var(--ink);margin:0 0 10px}
.toggle input{width:20px;height:20px}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.logo-item{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;align-items:center}
.logo-item img{max-width:100%;height:48px;object-fit:contain}
.logo-item .acts{display:flex;gap:4px}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar .spacer{flex:1}
.toolbar .note{color:var(--muted);font-size:12px;flex-basis:100%}
.stageWrap{padding:16px;display:flex;justify-content:center}
.stage{position:relative;overflow:hidden}
/* Poster düzeni: büyük başlık, iki sütun saat listesi, ortada tarih bloğu */
.sheet{--u:1;--tc:#fff;--fs:24;--k:21;--ff:"Quicksand","Trebuchet MS","Segoe UI",sans-serif;
  width:210mm;height:296.5mm;background-color:#14213d;color:var(--tc);transform-origin:top left;
  padding:calc(34px*var(--u)) calc(30px*var(--u)) calc(28px*var(--u));box-shadow:0 2px 14px rgba(0,0,0,.28);overflow:hidden;font-family:var(--ff);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;background-size:100% 100%;background-repeat:no-repeat;
  display:flex;flex-direction:column;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.sheet.a3{width:297mm;height:419.5mm;--u:1.4142}
.sheet .logos-row{display:flex;gap:calc(18px*var(--u));justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:calc(10px*var(--u))}
.sheet .logos-row img{height:calc(56px*var(--u));max-width:calc(200px*var(--u));object-fit:contain}
.sheet h1{margin:0;text-align:center;font-weight:700;text-transform:uppercase;line-height:1.1;letter-spacing:.02em}
.sheet .ev{margin:calc(8px*var(--u)) 0 0;text-align:center;font-size:calc(21px*var(--u));font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.sheet .dinfo{margin-top:calc(10px*var(--u));text-align:center;font-size:calc(22px*var(--u));font-weight:600;line-height:1.35;text-transform:uppercase}
.sheet .lists{flex:1;min-height:0;margin-top:calc(16px*var(--u));display:grid;grid-template-rows:auto 1fr;column-gap:calc(14px*var(--u))}
.sheet .lists.c1{grid-template-columns:1fr 1.3fr 1fr}
.sheet .lists.c2{grid-template-columns:1fr 1fr}
.sheet .hd{grid-row:1;text-align:center;font-weight:700;font-size:calc(27px*var(--u));letter-spacing:.03em;text-transform:uppercase;
  border-bottom:calc(2px*var(--u)) solid currentColor;padding-bottom:calc(6px*var(--u));margin-bottom:calc(8px*var(--u));align-self:end}
.sheet .col{grid-row:2;display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--k),1fr);grid-auto-columns:1fr;align-items:center;justify-items:center;min-height:0}
.sheet .col span{font-size:calc(var(--fs)*1px*var(--u));font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;line-height:1}
.sheet .mid{grid-row:2;grid-column:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-size:calc(27px*var(--u));font-weight:600;line-height:1.5;text-transform:uppercase}
.sheet .l{grid-column:1}
.sheet .c1 .r{grid-column:3}
.sheet .c2 .r{grid-column:2}
.sheet .nbox{margin-top:calc(12px*var(--u));text-align:center;font-size:calc(15px*var(--u));font-style:italic;font-weight:600}
.sheet .xnote{margin-top:calc(8px*var(--u));text-align:center;font-size:calc(14px*var(--u));white-space:pre-wrap}

.sheet.driver{background:#fff;color:#111;text-shadow:none;font-family:"Segoe UI",Calibri,Arial,sans-serif}
.driver h1{font-size:calc(26px*var(--u));letter-spacing:.02em}
.driver .ev{font-size:calc(17px*var(--u));letter-spacing:.08em}
.driver .dline{margin:calc(4px*var(--u)) 0 0;text-align:center;font-size:calc(14px*var(--u));font-weight:600}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:calc(16px*var(--u));margin-top:calc(14px*var(--u));flex:1;min-height:0;align-content:start}
.dtab{min-width:0}
.dtab h2{margin:0 0 calc(5px*var(--u));background:#1f2937;color:#fff;font-size:calc(13px*var(--u));padding:calc(6px*var(--u)) calc(8px*var(--u));text-transform:uppercase;letter-spacing:.04em}
.dtab table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:calc(var(--dfs)*1px*var(--u))}
.dtab th,.dtab td{border:1px solid #b6bcc4;height:calc(var(--rh)*1px*var(--u));padding:0 calc(4px*var(--u));text-align:center;line-height:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dtab th{background:#e5e7eb}
.dtab td.nt{text-align:left}
.driver .nbox{border:0;color:#111}
details.drv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.drv summary{cursor:pointer;font-weight:700;color:var(--primary)}
.tscroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table.dt{width:100%;border-collapse:collapse}
table.dt th{position:sticky;top:0;background:var(--soft);text-align:left;padding:6px 8px;font-size:12px}
table.dt td{padding:3px 6px;border-top:1px solid var(--line)}
table.dt td:first-child{font-weight:700;font-variant-numeric:tabular-nums;width:60px}
table.dt input{min-height:32px;padding:4px 8px}
table.dt td:nth-child(2){width:84px}
.shareBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-basis:100%}
/* Ana sayfa: üst yarıda hareketli rota haritası, sağ üstte dijital saat */
.home{flex:1;min-height:0;overflow:auto}
body:not([data-tab="home"]) .home{display:none}
body[data-tab="home"] .shell{display:none}
.mapbox{position:relative;height:clamp(260px,50vh,560px);background:#0d1a14;overflow:hidden;border-bottom:1px solid var(--line)}
.mapbox .blur{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(16px) brightness(.55)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.clock{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));
  background:rgba(8,16,12,.82);border:1px solid rgba(255,255,255,.18);padding:8px 14px 9px;text-align:right;color:#c8ffd9;border-radius:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.45)}
.clock .tm{font:700 clamp(30px,6vw,60px)/1 "Consolas","DejaVu Sans Mono","Courier New",monospace;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(120,255,170,.65)}
.clock .tm i{font-style:normal;animation:blink 1s steps(2,start) infinite}
.clock .tm small{font-size:.5em;opacity:.8;margin-left:2px}
.clock .dt{margin-top:4px;font:600 clamp(11px,1.6vw,15px)/1.2 var(--font);color:#9fe6b8;letter-spacing:.05em;text-transform:uppercase}
@keyframes blink{50%{opacity:.25}}
.homeBody{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1100px;margin:0 auto}
@media (max-width:700px){.homeBody{grid-template-columns:1fr}.mapbox{height:auto;aspect-ratio:1090/639}}
.next{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.next h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.next .big{font:700 40px/1.1 "Consolas","DejaVu Sans Mono",monospace;font-variant-numeric:tabular-nums;color:var(--primary)}
.next .sub{color:var(--muted);margin-top:4px}
.homeBar{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.homeBar .info{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.clock .tm i{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:90vw}
.toast[hidden]{display:none}
@media print{
  html,body{height:auto;background:#fff!important;display:block}
  .top,.tabs,.panel,.toolbar,.toast,.home{display:none!important}
  .shell{display:block!important}
  .preview{display:block!important;overflow:visible!important;background:none!important}
  .stageWrap{padding:0!important;display:block!important}
  .stage{height:auto!important;width:auto!important;overflow:visible!important}
  .sheet{transform:none!important;box-shadow:none!important;margin:0!important}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Josefin+Sans:wght@500;700&family=Montserrat:wght@500;700&family=Raleway:wght@500;700&display=swap">
<style id="pageStyle">@page{size:A4;margin:0}</style>
</head>
<body data-tab="home">
<header class="top">
  <button class="logo-btn" id="appLogoBtn" type="button" aria-label="Logo"></button>
  <div class="brand"><b data-i18n="brand"></b><small data-i18n="tagline"></small></div>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-lang="tr" aria-pressed="true">TR</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist">
  <button type="button" role="tab" data-tab="home" aria-selected="true" data-i18n="tabHome"></button>
  <button type="button" role="tab" data-tab="schedule" aria-selected="false" data-i18n="tabSchedule"></button>
  <button type="button" role="tab" data-tab="doc" aria-selected="false" data-i18n="tabDoc"></button>
  <button type="button" role="tab" data-tab="look" aria-selected="false" data-i18n="tabLook"></button>
  <button type="button" role="tab" id="tab-preview" data-tab="preview" aria-selected="false" data-i18n="tabPreview"></button>
</nav>
<section class="home" id="home">
  <div class="mapbox" id="mapbox">
    <div class="blur" id="mapBlur"></div>
    <svg id="mapSvg" viewBox="0 0 1090 639" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map">
      <image id="mapImg" x="0" y="0" width="1090" height="639" preserveAspectRatio="none"/>
      <path id="routeGlow" fill="none" stroke="#5b8cff" stroke-opacity=".55" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="route" fill="none" stroke="#4a3df0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="routeFlow" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 16"/>
      <g id="pinFac"><circle r="14" fill="#fff" stroke="#1d5c47" stroke-width="5"/><circle r="5" fill="#1d5c47"/></g>
      <g id="pinHotel"><circle r="14" fill="#fff" stroke="#d93a2f" stroke-width="5"/><circle r="5" fill="#d93a2f"/></g>
      <g id="lblFac"><rect rx="5" height="26" fill="#0d1a14" fill-opacity=".85"/><text id="lblFacT" y="18" fill="#fff" font-size="15" font-weight="700" font-family="Segoe UI,system-ui,sans-serif"></text></g>
      <g id="lblHotel"><rect rx="5" height="26" fill="#0d1a14" fill-opacity=".85"/><text id="lblHotelT" y="18" fill="#fff" font-size="15" font-weight="700" font-family="Segoe UI,system-ui,sans-serif"></text></g>
      <g id="bus">
        <ellipse cx="0" cy="3" rx="19" ry="10" fill="#000" fill-opacity=".3"/>
        <rect x="-18" y="-9" width="36" height="18" rx="5" fill="#ffc933" stroke="#fff" stroke-width="2"/>
        <rect x="7" y="-6.5" width="8" height="13" rx="2" fill="#16302a"/>
        <rect x="-14" y="-6" width="5" height="12" rx="1.5" fill="#16302a" fill-opacity=".7"/>
        <rect x="-7" y="-6" width="5" height="12" rx="1.5" fill="#16302a" fill-opacity=".7"/>
      </g>
    </svg>
    <div class="clock" aria-live="off"><div class="tm" id="clkT"></div><div class="dt" id="clkD"></div></div>
  </div>
  <div class="homeBody">
    <div class="homeBar"><span class="info" id="routeInfo"></span><button class="btn primary" type="button" id="goSchedule" data-i18n="editSchedule"></button></div>
    <div class="next"><h3 id="nx0h"></h3><div class="big" id="nx0t"></div><div class="sub" id="nx0s"></div></div>
    <div class="next"><h3 id="nx1h"></h3><div class="big" id="nx1t"></div><div class="sub" id="nx1s"></div></div>
  </div>
</section>
<main class="shell">
<section class="panel" id="panel">

  <div class="pane" id="pane-schedule">
    <div class="card">
      <h3 data-i18n="profileTitle"></h3>
      <div class="stack">
        <div><label for="profSel" data-i18n="profileSel"></label><select id="profSel"></select></div>
        <div><label for="pName" data-i18n="profileName"></label><input type="text" id="pName"></div>
        <div class="row">
          <button class="btn" type="button" id="profNew" data-i18n="new"></button>
          <button class="btn" type="button" id="profDup" data-i18n="duplicate"></button>
          <button class="btn danger" type="button" id="profDel" data-i18n="delete"></button>
        </div>
      </div>
    </div>
    <div id="dirCards"></div>
    <div class="card">
      <h3 data-i18n="lastTitle"></h3>
      <label class="toggle"><input type="checkbox" id="lastOn"><span data-i18n="lastToggle"></span></label>
      <div class="stack">
        <div><label for="lastTr">Türkçe</label><textarea id="lastTr"></textarea></div>
        <div><label for="lastEn">English</label><textarea id="lastEn"></textarea></div>
      </div>
    </div>
  </div>

  <div class="pane" id="pane-doc">
    <div class="card">
      <h3 data-i18n="docTitleCard"></h3>
      <div class="stack">
        <div class="grid2">
          <div><label for="fLang" data-i18n="fLang"></label><select id="fLang"><option value="en">English</option><option value="tr">Türkçe</option></select></div>
          <div><label for="fPage" data-i18n="fPage"></label><select id="fPage"><option value="A4">A4</option><option value="A3">A3</option></select></div>
        </div>
        <div><label for="fTitleEn" data-i18n="fTitleEn"></label><input type="text" id="fTitleEn"></div>
        <div><label for="fTitleTr" data-i18n="fTitleTr"></label><input type="text" id="fTitleTr"></div>
        <div><label for="fEvent" data-i18n="fEvent"></label><input type="text" id="fEvent"></div>
        <div class="grid2">
          <div><label for="fFrom" data-i18n="fFrom"></label><input type="date" id="fFrom"></div>
          <div><label for="fTo" data-i18n="fTo"></label><input type="date" id="fTo"></div>
        </div>
        <div><label data-i18n="weekQuick"></label><div class="row" id="weekBtns"><button class="btn small" type="button" data-w="1"></button><button class="btn small" type="button" data-w="2"></button><button class="btn small" type="button" data-w="3"></button><button class="btn small" type="button" data-w="4"></button></div></div>
        <div class="grid2">
          <div><label for="fDtEn" data-i18n="dateTxtEn"></label><input type="text" id="fDtEn" placeholder="23 FEB - 15 MAR&#10;2026"></div>
          <div><label for="fDtTr" data-i18n="dateTxtTr"></label><input type="text" id="fDtTr" placeholder="23 ŞUB - 15 MAR / 2026"></div>
        </div>
        <p class="hint" data-i18n="dateTxtHint" style="margin:0"></p>
        <label class="toggle"><input type="checkbox" id="fWeeks"><span data-i18n="fWeeks"></span></label>
        <div class="grid3">
          <div><label for="fHotelEn" data-i18n="fHotelEn"></label><input type="text" id="fHotelEn"></div>
          <div><label for="fHotelTr" data-i18n="fHotelTr"></label><input type="text" id="fHotelTr"></div>
          <div><label for="fFac" data-i18n="fFac"></label><input type="text" id="fFac"></div>
        </div>
        <div><label for="xTr" data-i18n="fExtraTr"></label><textarea id="xTr"></textarea></div>
        <div><label for="xEn" data-i18n="fExtraEn"></label><textarea id="xEn"></textarea></div>
      </div>

<script>
//#BUILD_START
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=new TextEncoder();
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
  const now=new Date(),dt=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),dd=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const parts=[],cen=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+data.length;
  }
  let cs=0;cen.forEach(x=>cs+=x.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  const all=[...parts,...cen,new Uint8Array(end.buffer)];
  let total=0;all.forEach(x=>total+=x.length);
  const out=new Uint8Array(total);let p=0;all.forEach(x=>{out.set(x,p);p+=x.length});
  return out;
}
const CT_REL='http://schemas.openxmlformats.org/package/2006/relationships';
const R_NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const XMLH='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

/* Excel: iki sütunlu poster düzeni (sol: otelden, sağ: tesisten) */
function buildXlsx(M){
  const rows=[],merges=[];let r=0;
  const addRow=(ht,fn)=>{r++;rows.push(`<row r="${r}"${ht?` ht="${ht}" customHeight="1"`:''}>${fn(r)}</row>`);return r};
  const str=(ref,s,t)=>`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${esc(t)}</t></is></c>`;
  const merged=(text,s,ht)=>{const n=addRow(ht,rr=>str('A'+rr,s,text)+`<c r="B${rr}" s="${s}"/><c r="C${rr}" s="${s}"/>`);merges.push(`A${n}:C${n}`);return n};
  const hasLogos=M.logos.length>0,hasBg=!!M.bg;
  addRow(hasLogos?58:6,()=>'');
  if(M.title)merged(M.title,1,32);
  if(M.event)merged(M.event,2,22);
  M.dateLines.forEach(t=>merged(t,3,20));
  addRow(12,()=>'');
  const A=M.sections[0],B=M.sections[1];
  addRow(24,rr=>str('A'+rr,4,A.label)+`<c r="B${rr}" s="0"/>`+str('C'+rr,4,B.label));
  const n=Math.max(A.times.length,B.times.length);
  for(let i=0;i<n;i++)addRow(19,rr=>(A.times[i]?str('A'+rr,5,A.times[i]):`<c r="A${rr}" s="0"/>`)+`<c r="B${rr}" s="0"/>`+(B.times[i]?str('C'+rr,5,B.times[i]):`<c r="C${rr}" s="0"/>`));
  addRow(12,()=>'');
  if(M.note)merged(M.note,6,34);
  if(M.extra)merged(M.extra,6,50);
  const sheet=`${XMLH}<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R_NS}"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols><col min="1" max="1" width="24" customWidth="1"/><col min="2" max="2" width="8" customWidth="1"/><col min="3" max="3" width="24" customWidth="1"/></cols><sheetData>${rows.join('')}</sheetData><mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="${M.page==='A3'?8:9}" orientation="portrait" fitToWidth="1" fitToHeight="1"/>${hasLogos?'<drawing r:id="rId1"/>':''}${hasBg?'<picture r:id="rId2"/>':''}</worksheet>`;
  const tc=`<color rgb="FF${M.textHex}"/>`;
  const fnt=(x)=>`<font>${x}${tc}<name val="Calibri"/></font>`;
  const styles=`${XMLH}<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="7">${fnt('<sz val="11"/>')}${fnt('<b/><sz val="22"/>')}${fnt('<b/><sz val="14"/>')}${fnt('<sz val="12"/>')}${fnt('<b/><sz val="14"/>')}${fnt('<b/><sz val="13"/>')}${fnt('<i/><sz val="11"/>')}</fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="medium"><color rgb="FF${M.textHex}"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${[[1,0],[2,0],[3,0],[4,1],[5,0]].map(([f,b])=>`<xf numFmtId="0" fontId="${f}" fillId="0" borderId="${b}" xfId="0" applyFont="1"${b?' applyBorder="1"':''} applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>`).join('')}<xf numFmtId="0" fontId="6" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const files=[];
  files.push({name:'[Content_Types].xml',data:`${XMLH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hasLogos?'<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>':''}</Types>`});
  files.push({name:'_rels/.rels',data:`${XMLH}<Relationships xmlns="${CT_REL}"><Relationship Id="rId1" Type="${R_NS}/officeDocument" Target="xl/workbook.xml"/></Relationships>`});
  files.push({name:'xl/workbook.xml',data:`${XMLH}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R_NS}"><sheets><sheet name="${esc((M.sheetName||'Sheet1').replace(/[\\\/?*\[\]:]/g,'').slice(0,31))}" sheetId="1" r:id="rId1"/></sheets></workbook>`});
  files.push({name:'xl/_rels/workbook.xml.rels',data:`${XMLH}<Relationships xmlns="${CT_REL}"><Relationship Id="rId1" Type="${R_NS}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R_NS}/styles" Target="styles.xml"/></Relationships>`});
  files.push({name:'xl/styles.xml',data:styles});
  files.push({name:'xl/worksheets/sheet1.xml',data:sheet});
  let srels='';
  if(hasLogos)srels+=`<Relationship Id="rId1" Type="${R_NS}/drawing" Target="../drawings/drawing1.xml"/>`;
  if(hasBg){srels+=`<Relationship Id="rId2" Type="${R_NS}/image" Target="../media/bg.${M.bg.ext}"/>`;files.push({name:`xl/media/bg.${M.bg.ext}`,data:M.bg.bytes})}
  if(srels)files.push({name:'xl/worksheets/_rels/sheet1.xml.rels',data:`${XMLH}<Relationships xmlns="${CT_REL}">${srels}</Relationships>`});
  if(hasLogos){
    const H=50,gap=14,sheetW=400;let tot=0;const sz=M.logos.map(l=>{const w=Math.round(H*l.w/l.h);tot+=w+gap;return w});
    const k=Math.min(1,(sheetW-30)/Math.max(1,tot-gap));let x=Math.round((sheetW-(tot-gap)*k)/2);
    let anchors='',drels='';
    M.logos.forEach((l,i)=>{
      const cx=Math.round(sz[i]*k*9525),cy=Math.round(H*k*9525),px=x*9525,py=Math.round((8+(H-H*k)/2)*9525);

      drels+=`<Relationship Id="rId${i+1}" Type="${R_NS}/image" Target="../media/logo${i+1}.${l.ext}"/>`;
      files.push({name:`xl/media/logo${i+1}.${l.ext}`,data:l.bytes});
    });
    files.push({name:'xl/drawings/drawing1.xml',data:`${XMLH}<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${R_NS}">${anchors}</xdr:wsDr>`});
    files.push({name:'xl/drawings/_rels/drawing1.xml.rels',data:`${XMLH}<Relationships xmlns="${CT_REL}">${drels}</Relationships>`});
  }
  return zip(files);
}

/* Word: poster düzeni. Tek sütunlu listede ortada tarih bloğu, çok satırda iki alt sütun */
function buildDocx(M){
  const A3=M.page==='A3',sc=A3?1.4142:1,PW=A3?16838:11906,PH=A3?23811:16838,MG=900,W=PW-2*MG,TC=M.textHex;
  const FONT='<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>';
  const rpr=o=>`<w:rPr>${FONT}${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}<w:color w:val="${o.color||TC}"/><w:sz w:val="${o.sz||22}"/></w:rPr>`;
  const para=(text,o={})=>`<w:p><w:pPr><w:spacing w:before="${o.before||0}" w:after="${o.after||0}"/><w:jc w:val="${o.jc||'center'}"/></w:pPr><w:r>${rpr(o)}<w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p>`;
  const files=[],rels=[];let did=10,body='';
  const pic=(rid,cx,cy,name,anchor)=>{
    const g=`<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic>`;
    if(anchor)return `<w:r><w:drawing><wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="0" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1"><wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionH><wp:positionV relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionV><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/><wp:docPr id="${did++}" name="${name}"/><wp:cNvGraphicFramePr/>${g}</wp:anchor></w:drawing></w:r>`;
    return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${did++}" name="${name}"/><wp:cNvGraphicFramePr/>${g}</wp:inline></w:drawing></w:r>`;
  };
  const a=M.sections[0].times,b=M.sections[1].times,mx=Math.max(a.length,b.length,1);
  const SC=mx>34?2:1,k=Math.ceil(mx/SC),center=SC===1&&M.dateLines.length>0;
  const tp=Math.max(14,Math.min(26*sc,(W/20)/(Math.max(M.title.length,1)*0.62)));
  let top=0;
  if(M.logos.length){
    const H=560000,gap=180000,maxW=W*635-200000;let tot=0;const ws=M.logos.map(l=>{const w=Math.round(H*l.w/l.h);tot+=w+gap;return w});
    const kk=Math.min(1,maxW/Math.max(1,tot-gap));let runs='';
    M.logos.forEach((l,i)=>{
      const rid=`rIdL${i+1}`;rels.push(`<Relationship Id="${rid}" Type="${R_NS}/image" Target="media/logo${i+1}.${l.ext}"/>`);
      files.push({name:`word/media/logo${i+1}.${l.ext}`,data:l.bytes});
      runs+=pic(rid,Math.round(ws[i]*kk),Math.round(H*kk),`Logo ${i+1}`,false);
      if(i<M.logos.length-1)runs+=`<w:r>${rpr({})}<w:t xml:space="preserve">      </w:t></w:r>`;
    });
    body+=`<w:p><w:pPr><w:spacing w:before="0" w:after="120"/><w:jc w:val="center"/></w:pPr>${runs}</w:p>`;top+=1050;
  }
  if(M.title){body+=para(M.title,{b:1,sz:Math.round(tp*2),after:60});top+=tp*20*1.3+60}
  if(M.event){body+=para(M.event,{b:1,sz:Math.round(22*sc*2*0.7),after:60});top+=420}
  if(!center)for(const d of M.dateLines){body+=para(d,{b:1,sz:Math.round(15*sc*2),after:20});top+=420}
  top+=(M.note?520:0)+(M.extra?500:0)+300;
  const avail=PH-2*MG-top-1000,rowH=Math.max(200,Math.min(Math.round(560*sc),Math.floor(avail/k)));
  const fpt=Math.max(6,Math.min(16*sc,rowH/20*0.58)),fsz=Math.round(fpt*2),hsz=Math.round(Math.min(18*sc,fpt*1.25)*2),msz=Math.round(14*sc*2);
  let widths;
  if(center){const s=Math.round(W*0.3);widths=[s,W-2*s,s]}else{widths=Array(2*SC).fill(Math.floor(W/(2*SC)))}
  const bdr=`<w:tcBorders><w:bottom w:val="single" w:sz="12" w:space="0" w:color="${TC}"/></w:tcBorders>`;
  const hcell=(w,span,text)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span>1?`<w:gridSpan w:val="${span}"/>`:''}${text?bdr:''}<w:vAlign w:val="bottom"/></w:tcPr>${para(text,{b:1,sz:hsz,before:40,after:60})}</w:tc>`;
  const tcell=(w,text)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${para(text,{b:1,sz:fsz})}</w:tc>`;
  let tbl=`<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
  tbl+='<w:tr>';
  if(center)tbl+=hcell(widths[0],1,M.sections[0].label)+hcell(widths[1],1,'')+hcell(widths[2],1,M.sections[1].label);
  else tbl+=hcell(widths[0]*SC,SC,M.sections[0].label)+hcell(widths[0]*SC,SC,M.sections[1].label);
  tbl+='</w:tr>';
  for(let r=0;r<k;r++){
    tbl+=`<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="${rowH}" w:hRule="exact"/></w:trPr>`;
    if(center){
      tbl+=tcell(widths[0],a[r]||'');
      tbl+=`<w:tc><w:tcPr><w:tcW w:w="${widths[1]}" w:type="dxa"/><w:vMerge${r===0?' w:val="restart"':''}/><w:vAlign w:val="center"/></w:tcPr>${r===0?M.dateLines.map(d=>para(d,{b:1,sz:msz,after:40})).join(''):'<w:p/>'}</w:tc>`;
      tbl+=tcell(widths[2],b[r]||'');
    }else{
      for(const X of [a,b])for(let c=0;c<SC;c++)tbl+=tcell(widths[0],X[c*k+r]||'');
    }

function addXlsxLogos(M,files,sheetW){

  }

  if(M.event){body+=para(M.event,{b:1,sz:Math.round(15*sc*2),after:40});top+=420}
  if(M.dateLines.length){body+=para(M.dateLines.join('   '),{sz:Math.round(12*sc*2),after:160});top+=500}
  top+=(M.note?520:0)+(M.extra?500:0);
  const A=M.sections[0],B=M.sections[1],n=Math.max(A.rows.length,B.rows.length,1);
  const gap=Math.round(W*0.02),half=Math.floor((W-gap)/2),wt=Math.round(half*0.15),wv=Math.round(half*0.23),wn=half-wt-wv,widths=[wt,wv,wn,gap,wt,wv,wn];
  const avail=PH-2*MG-top-400,rowH=Math.max(240,Math.min(Math.round(380*sc),Math.floor(avail/(n+2))));

    {name:'word/document.xml',data:doc},

/* ---------- Saat hesabı ---------- */
const toM=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+m};
const fm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function baseTimes(d){const a=[],s=Math.max(MIN,toM(d.start)),e=Math.min(MAX,toM(d.end)),st=Math.max(5,+d.step||30);for(let m=s;m<=e;m+=st)a.push(fm(m));return a}
function times(d){const rm=new Set(d.removed),set=new Set(baseTimes(d).filter(x=>!rm.has(x)));d.extras.forEach(x=>set.add(x));return[...set].sort()}

/* ---------- Önizleme ---------- */
let bgCache={key:'',val:null};
function loadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
function dirName(i){return t('dir'+i)}
function dateText(p){
  if(!p.from)return'';
  const f=d=>new Date(d+'T12:00:00').toLocaleDateString(S.lang==='tr'?'tr-TR':'en-GB',{day:'numeric',month:'long',year:'numeric'});
  return p.to&&p.to!==p.from?f(p.from)+' – '+f(p.to):f(p.from);
}
async function buildBg(){
  const b=S.bg,eff=b.mode==='image'&&b.img?'image':'color',center=S.logoPos==='center'&&S.logos.length>0;
  const key=JSON.stringify([eff,b.color,b.veil,b.img?b.img.length:0,center?S.logos.map(l=>l.src.length+':'+l.w).join(','):'',S.logoAlpha]);
  if(bgCache.key===key)return bgCache.val;
  let val;
  if(eff==='color'&&!center){
    const c=document.createElement('canvas');c.width=8;c.height=11;const x=c.getContext('2d');x.fillStyle=b.color;x.fillRect(0,0,8,11);
    val={src:c.toDataURL('image/png'),ext:'png'};
  }else{
    const W=1240,H=1754,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle=b.color;x.fillRect(0,0,W,H);
    if(eff==='image'){
      const im=await loadImg(b.img),k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;
      x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
      x.fillStyle=`rgba(0,0,0,${b.veil/100})`;x.fillRect(0,0,W,H);
    }
    if(center){
      const ims=await Promise.all(S.logos.map(l=>loadImg(l.src))),n=ims.length,gap=50,slot=(H*0.46-gap*(n-1))/n;
      const dims=ims.map(im=>{const k=Math.min(W*0.62/im.width,slot/im.height);return{im,w:im.width*k,h:im.height*k}});
      let y=(H-(dims.reduce((s,d)=>s+d.h,0)+gap*(n-1)))/2;
      x.globalAlpha=S.logoAlpha/100;
      dims.forEach(d=>{x.drawImage(d.im,(W-d.w)/2,y,d.w,d.h);y+=d.h+gap});
      x.globalAlpha=1;
    }
    val={src:c.toDataURL('image/jpeg',0.88),ext:'jpeg'};
  }
  bgCache={key,val};return val;
}
function dateLines(p,L){
  const ct=(p.dateCustom&&p.dateCustom[L]||'').trim();if(ct)return ct.split(/\s*\/\s*|\n/).filter(Boolean);
  if(!p.from)return[];
  const loc=L==='tr'?'tr-TR':'en-GB';
  const f=s=>new Date(s+'T12:00:00').toLocaleDateString(loc,{day:'numeric',month:'short'}).replace(/\./g,'').toLocaleUpperCase(loc);
  const two=p.to&&p.to!==p.from,out=[two?f(p.from)+' - '+f(p.to):f(p.from)];
  const y1=p.from.slice(0,4),y2=(p.to||p.from).slice(0,4);
  out.push(y1===y2?y1:y1+' - '+y2);
  if(p.weeks&&two){
    const days=Math.round((new Date(p.to+'T12:00:00')-new Date(p.from+'T12:00:00'))/864e5)+1,w=Math.max(1,Math.ceil(days/7));
    out.push(L==='tr'?w+' HAFTA':w+(w===1?' WEEK':' WEEKS'));
  }
  return out;
}
function sheetDir(i,L){const h=S.names.hotel[L]||'',f=S.names.fac||'';return i===0?`${h} - ${f}`:`${f} - ${h}`}
function ffStack(){return `"${S.font}","Quicksand","Trebuchet MS","Segoe UI",sans-serif`}
async function renderSheet(){
  if(view==='driver'){renderDriver();return}
  const p=cur(),sh=$('#sheet'),L=S.docLang,a=times(p.dirs[0]),b=times(p.dirs[1]);
  const mx=Math.max(a.length,b.length,1),sc=mx>34?2:1,k=Math.ceil(mx/sc);
  const title=(p.title[L]||'').toUpperCase(),tsz=Math.max(22,Math.min(50,700/(Math.max(title.length,1)*0.62)));
  const dl=dateLines(p,L),center=sc===1&&dl.length>0,topLogos=S.logoPos==='top'&&S.logos.length>0;
  const note=p.lastOn&&p.last[L]?p.last[L]:'',extra=p.extra[L]||'';
  const used=68+tsz*1.2+(p.event?34:0)+(!center&&dl.length?dl.length*30+10:0)+(topLogos?66:0)+16+60+(note?44:0)+(extra?30*extra.split('\n').length:0);
  const fs=Math.max(9,Math.min(27,(1123-used)/k*0.6));
  sh.className='sheet'+(S.page==='A3'?' a3':'');
  sh.lang=L;
  sh.style.setProperty('--fs',fs.toFixed(1));sh.style.setProperty('--k',k);sh.style.setProperty('--tc',S.textColor);sh.style.setProperty('--ff',ffStack());
  $('#pageStyle').textContent=`@page{size:${S.page==='A3'?'A3':'A4'};margin:0}`;
  const col=(arr,side)=>`<div class="col ${side}">${arr.map(x=>`<span>${x}</span>`).join('')}</div>`;
  const lines=arr=>arr.map(x=>`<div>${esc(x)}</div>`).join('');
  sh.innerHTML=`${topLogos?`<div class="logos-row">${S.logos.map(l=>`<img src="${l.src}" alt="">`).join('')}</div>`:''}`
   +`<h1 style="font-size:calc(${tsz.toFixed(1)}px*var(--u))">${esc(title)}</h1>${p.event?`<p class="ev">${esc(p.event)}</p>`:''}`
   +`${!center&&dl.length?`<div class="dinfo">${lines(dl)}</div>`:''}`
   +`<div class="lists ${center?'c1':'c2'}"><div class="hd l">${esc(sheetDir(0,L))}</div><div class="hd r">${esc(sheetDir(1,L))}</div>${col(a,'l')}${center?`<div class="mid">${lines(dl)}</div>`:''}${col(b,'r')}</div>`
   +`${note?`<div class="nbox">${esc(note)}</div>`:''}${extra?`<div class="xnote">${esc(extra)}</div>`:''}`;
  const bg=await buildBg().catch(()=>null);
  sh.style.backgroundColor=S.bg.color;
  sh.style.backgroundImage=bg?`url(${bg.src})`:'none';
  fit();
}
function fit(){
  const wrap=document.querySelector('.stageWrap'),st=$('#stage'),sh=$('#sheet');
  if(!wrap.clientWidth)return;
  const full=sh.offsetWidth,s=Math.min(1,(wrap.clientWidth-32)/full);
  sh.style.transform=`scale(${s})`;st.style.width=full*s+'px';st.style.height=sh.offsetHeight*s+'px';
}

/* Rota: otelden (kırmızı iğne) spor tesisine, harita görselinin piksel koordinatlarında */
const ROUTE=[[372,578],[372,552],[480,553],[590,550],[600,538],[588,500],[574,440],[559,380],[553,320],[556,260],[563,200],[571,152],[577,140],[547,152],[490,158],[447,148],[441,110],[437,72],[395,75]];
const routeEl=$('#route');
$('#mapImg').setAttribute('href',MAP_SRC);
$('#mapBlur').style.backgroundImage=`url(${MAP_SRC})`;
const routeD='M'+ROUTE.map(p=>p.join(' ')).join(' L');
['#route','#routeGlow','#routeFlow'].forEach(s=>$(s).setAttribute('d',routeD));
const ROUTE_LEN=routeEl.getTotalLength();
function placePins(){
  const a=ROUTE[0],b=ROUTE[ROUTE.length-1];
  $('#pinHotel').setAttribute('transform',`translate(${a[0]} ${a[1]})`);
  $('#pinFac').setAttribute('transform',`translate(${b[0]} ${b[1]})`);
  const lbl=(g,txt,x,y)=>{$('#'+g+'T').textContent=txt;const w=txt.length*8.4+16;const gg=$('#'+g);gg.querySelector('rect').setAttribute('width',w);$('#'+g+'T').setAttribute('x',8);gg.setAttribute('transform',`translate(${x} ${y})`)};
  lbl('lblFac',t('facility'),b[0]+20,b[1]-34);
  lbl('lblHotel',t('hotel'),a[0]+20,a[1]-8);
}
let legStart=performance.now(),LEG_MS=13000,PAUSE_MS=1600;
function animBus(now){
  const cyc=LEG_MS+PAUSE_MS,k=Math.floor((now-legStart)/cyc),ph=(now-legStart)%cyc,fwd=k%2===0;
  let f=Math.min(1,ph/LEG_MS);f=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
  const d=(fwd?f:1-f)*ROUTE_LEN,p=routeEl.getPointAtLength(d),q=routeEl.getPointAtLength(Math.min(ROUTE_LEN,Math.max(0,d+(fwd?3:-3))));
  const ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
  $('#bus').setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${ang})`);
  const fl=$('#routeFlow');fl.style.strokeDashoffset=-(now/40)%36*(fwd?-1:1);
  requestAnimationFrame(animBus);
}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(animBus);
else $('#bus').setAttribute('transform',`translate(${ROUTE[0][0]} ${ROUTE[0][1]})`);
const pad2=n=>String(n).padStart(2,'0');
function tickClock(){
  const d=new Date();
  $('#clkT').innerHTML=`${pad2(d.getHours())}<i>:</i>${pad2(d.getMinutes())}<i>:</i><small>${pad2(d.getSeconds())}</small>`;
  $('#clkD').textContent=d.toLocaleDateString(S.lang==='tr'?'tr-TR':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const p=cur(),today=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()),nowM=d.getHours()*60+d.getMinutes();
  const off=(p.from&&today<p.from)||(p.to&&today>p.to);
  [0,1].forEach(i=>{
    $('#nx'+i+'h').textContent=t('nextFrom'+i);
    if(off){$('#nx'+i+'t').textContent='--:--';$('#nx'+i+'s').textContent=t('notActive')+(p.from?' ('+dateText(p)+')':'');return}
    const nx=times(p.dirs[i]).find(x=>toM(x)>=nowM);
    if(!nx){$('#nx'+i+'t').textContent='--:--';$('#nx'+i+'s').textContent=t('doneToday')+(p.lastOn&&p.last[S.lang]?'. '+p.last[S.lang]:'');return}
    const diff=toM(nx)-nowM;
    $('#nx'+i+'t').textContent=nx;$('#nx'+i+'s').textContent=diff>0?`${diff} ${t('inMin')}`:t('nowDep');
  });
}
setInterval(tickClock,1000);
$('#goSchedule').addEventListener('click',()=>setTab('schedule'));
function renderHome(){placePins();$('#routeInfo').textContent=t('routeInfo');tickClock()}
function renderAll(){applyI18n();renderHome();renderProfiles();renderDirs();syncForm();renderLogos();renderAppLogo();renderSheet();save()}

/* ---------- Olaylar ---------- */
function setTab(n){
  if(n==='preview'&&matchMedia('(min-width:980px)').matches)n='schedule';
  document.body.dataset.tab=n;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===n));
  if(n==='preview')setTimeout(fit,30);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)});
matchMedia('(min-width:980px)').addEventListener('change',()=>{if(document.body.dataset.tab==='preview')setTab('schedule');fit()});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.lang;renderAll()}));

$('#dirCards').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const i=+b.dataset.i,d=cur().dirs[i],x=b.dataset.t,a=b.dataset.act;
  if(a==='tog'){const k=d.removed.indexOf(x);k<0?d.removed.push(x):d.removed.splice(k,1)}
  else if(a==='delx'){d.extras=d.extras.filter(v=>v!==x)}
  else if(a==='add'){
    const v=$('#add'+i).value;
    if(!v||toM(v)<MIN||toM(v)>MAX){toast(t('outRange'));return}
    const inBase=baseTimes(d).includes(v),k=d.removed.indexOf(v);
    if(inBase&&k>=0)d.removed.splice(k,1);
    else if(inBase||d.extras.includes(v)){toast(t('exists'));return}
    else d.extras.push(v);
  }
  else if(a==='reset'){d.removed=[];d.extras=[];d.info={}}
  else if(a==='applyall'){const v=$('#all'+i).value;d.info=d.info||{};times(d).forEach(x=>{(d.info[x]=d.info[x]||{}).n=v});ddOpen.add(i)}
  else if(a==='copy'){cur().dirs[1-i]=JSON.parse(JSON.stringify(d))}
  renderDirs();renderSheet();save();
});

function readImg(file,maxDim,type){return new Promise((ok,no)=>{
  const fr=new FileReader();fr.onerror=no;
  fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
    let w=im.naturalWidth||300,h=im.naturalHeight||300;const k=Math.min(1,maxDim/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
    x.drawImage(im,0,0,w,h);ok({src:c.toDataURL(type,0.88),w,h,name:file.name});
  };im.src=fr.result};
  fr.readAsDataURL(file)})}

function dl(data,name,mime){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

$('#bkFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.profiles||!o.profiles.length)throw 0;S=Object.assign(def(),o);S.cur=Math.min(S.cur||0,S.profiles.length-1);renderAll();toast(t('loaded'))}catch(x){toast(t('badBackup'))}};
  fr.readAsText(f);e.target.value='';
});

const bytes=u=>Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0));
async function model(){
  const p=cur(),L=S.docLang,W=I[L],drv=view==='driver',center=!drv&&S.logoPos==='center'&&S.logos.length>0;
  const bg=drv?null:await buildBg().catch(()=>null);
  const mk=(i)=>({label:sheetDir(i,L),times:times(p.dirs[i]),rows:driverRows(i)});
  const dl=dateLines(p,L);
  return{title:drv?W.drvTitle:(p.title[L]||'').toUpperCase(),event:p.event,dateLines:drv?[dl.join('  ·  ')].filter(Boolean):dl,
    sheetName:drv?W.drvTitle:W.sheetName,page:S.page,textHex:drv?'111111':S.textColor.slice(1).toUpperCase(),
    sections:[mk(0),mk(1)],labels:{time:W.colTime,veh:W.veh,note:W.note},
    note:p.lastOn?p.last[L]:'',extra:p.extra[L],
    logos:center?[]:S.logos.map(l=>({bytes:bytes(l.src),ext:'png',w:l.w,h:l.h})),
    bg:bg?{bytes:bytes(bg.src),ext:bg.ext}:null};
}

/* ---------- Şoför planı: düzenleme, önizleme, metin ve paylaşım ---------- */
let view='guest';
const ddOpen=new Set();
function driverRows(i){const d=cur().dirs[i],inf=d.info||{};return times(d).map(x=>{const v=inf[x]||{};return{t:x,n:String(v.n||''),note:String(v.note||'')}})}
function driverEditor(i,d){
  const rows=times(d).map(x=>{const v=(d.info||{})[x]||{};return `<tr><td>${x}</td><td><input type="number" min="0" max="99" inputmode="numeric" data-di="${i}" data-dt="${x}" data-df="n" value="${esc(v.n||'')}" aria-label="${esc(t('veh'))} ${x}"></td><td><input type="text" data-di="${i}" data-dt="${x}" data-df="note" value="${esc(v.note||'')}" aria-label="${esc(t('note'))} ${x}"></td></tr>`}).join('');
  return `<details class="drv" data-dd="${i}"${ddOpen.has(i)?' open':''}><summary>${t('driverPlan')}</summary>
    <div class="row" style="margin:10px 0"><div style="flex:1;min-width:140px"><label for="all${i}">${t('allVeh')}</label><input type="number" id="all${i}" min="0" max="99" inputmode="numeric"></div><button class="btn" type="button" data-act="applyall" data-i="${i}">${t('applyAll')}</button></div>
    <div class="tscroll"><table class="dt"><thead><tr><th>${t('colTime')}</th><th>${t('veh')}</th><th>${t('note')}</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function renderDriver(){
  const p=cur(),sh=$('#sheet'),L=S.docLang,W=I[L],A=driverRows(0),B=driverRows(1),n=Math.max(A.length,B.length,1);
  const dl=dateLines(p,L).join('  ·  '),logos=S.logos.length>0;
  const note=p.lastOn&&p.last[L]?p.last[L]:'',extra=p.extra[L]||'';
  const used=68+44+(p.event?32:0)+(dl?30:0)+(logos?66:0)+50+(note?44:0)+(extra?30*extra.split('\n').length:0);
  const rh=Math.max(11,Math.min(26,(1123-used)/(n+2))),fs=Math.min(14,rh*0.62);
  sh.className='sheet driver'+(S.page==='A3'?' a3':'');
  sh.lang=L;
  sh.style.setProperty('--rh',rh.toFixed(1));sh.style.setProperty('--dfs',fs.toFixed(1));
  $('#pageStyle').textContent=`@page{size:${S.page==='A3'?'A3':'A4'};margin:0}`;
  const tbl=(i,rows)=>`<div class="dtab"><h2>${esc(sheetDir(i,L))}</h2><table><colgroup><col style="width:15%"><col style="width:23%"><col></colgroup><thead><tr><th>${esc(W.colTime)}</th><th>${esc(W.veh)}</th><th>${esc(W.note)}</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.t}</b></td><td>${esc(r.n)}</td><td class="nt" title="${esc(r.note)}">${esc(r.note)}</td></tr>`).join('')}</tbody></table></div>`;
  sh.innerHTML=`${logos?`<div class="logos-row">${S.logos.map(l=>`<img src="${l.src}" alt="">`).join('')}</div>`:''}<h1>${esc(W.drvTitle)}</h1>${p.event?`<p class="ev">${esc(p.event)}</p>`:''}${dl?`<p class="dline">${esc(dl)}</p>`:''}<div class="dgrid">${tbl(0,A)}${tbl(1,B)}</div>${note?`<div class="nbox">${esc(note)}</div>`:''}${extra?`<div class="xnote">${esc(extra)}</div>`:''}`;
  sh.style.backgroundImage='none';sh.style.backgroundColor='#fff';fit();
}
function driverText(){
  const p=cur(),L=S.docLang,W=I[L],dl=dateLines(p,L).join(' · '),out=[W.drvTitle];
  if(p.event)out.push(p.event);if(dl)out.push(dl);out.push('');
  [0,1].forEach(i=>{out.push(sheetDir(i,L));driverRows(i).forEach(r=>{let s=r.t;if(r.n)s+=' - '+r.n+' '+W.vehWord;if(r.note)s+=' - '+r.note;out.push(s)});out.push('')});
  const nt=p.lastOn&&p.last[L];if(nt)out.push(nt);
  const ex=p.extra[L];if(ex)out.push(ex);
  return out.join('\n').trim();
}
